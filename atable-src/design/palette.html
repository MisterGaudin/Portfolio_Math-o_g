<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Palette des régions</title>
<style>
 body{margin:0;padding:18px;background:#fbf5ea;font-family:'DejaVu Sans',sans-serif;color:#2a1a0e}
 h1{font:700 22px 'DejaVu Serif',serif;margin:0 0 12px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
 .sw{border-radius:12px;padding:10px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px #0002}
 .sw b{font:700 18px 'DejaVu Serif',serif}.sw .c{font:700 26px 'DejaVu Sans',sans-serif;letter-spacing:1px}
 .sw small{font-size:11px;opacity:.9}.hex{font:12px monospace}
</style></head><body><h1>À TABLE ! — 12 couleurs de régions</h1><div class="grid" id="g"></div>
<script>const P=[
 {
  "id": "bretagne",
  "name": "Bretagne",
  "code": "BRE",
  "color": "#1F3F6E",
  "ink": "#FFFFFF",
  "why": "Bleu marine (la mer, le Gwenn-ha-du)",
  "contrast": 10.5
 },
 {
  "id": "normandie",
  "name": "Normandie",
  "code": "NMD",
  "color": "#4E9A3A",
  "ink": "#2A1A0E",
  "why": "Vert prairie (bocage, pommiers)",
  "contrast": 4.8
 },
 {
  "id": "nord",
  "name": "Nord",
  "code": "NRD",
  "color": "#E0A800",
  "ink": "#2A1A0E",
  "why": "Jaune or (houblon, beffrois)",
  "contrast": 7.8
 },
 {
  "id": "alsace",
  "name": "Alsace",
  "code": "ALS",
  "color": "#C8372D",
  "ink": "#FFFFFF",
  "why": "Rouge alsacien (géraniums, colombages)",
  "contrast": 5.2
 },
 {
  "id": "lorraine",
  "name": "Lorraine",
  "code": "LOR",
  "color": "#8E9A2B",
  "ink": "#2A1A0E",
  "why": "Vert mirabellier (vergers, Vosges)",
  "contrast": 5.4
 },
 {
  "id": "bourgogne",
  "name": "Bourgogne",
  "code": "BOU",
  "color": "#7B1E3A",
  "ink": "#FFFFFF",
  "why": "Lie-de-vin (vignobles)",
  "contrast": 10.1
 },
 {
  "id": "savoie",
  "name": "Savoie",
  "code": "SAV",
  "color": "#3E9BD6",
  "ink": "#2A1A0E",
  "why": "Bleu glacier (montagne, lacs)",
  "contrast": 5.5
 },
 {
  "id": "lyonnais",
  "name": "Lyonnais",
  "code": "LYO",
  "color": "#E8781F",
  "ink": "#2A1A0E",
  "why": "Orange (les toits de Lyon)",
  "contrast": 5.7
 },
 {
  "id": "auvergne",
  "name": "Auvergne",
  "code": "AUV",
  "color": "#6B4A32",
  "ink": "#FFFFFF",
  "why": "Brun volcan (pierre de lave)",
  "contrast": 7.9
 },
 {
  "id": "provence",
  "name": "Provence",
  "code": "PRO",
  "color": "#7A57B8",
  "ink": "#FFFFFF",
  "why": "Lavande",
  "contrast": 5.5
 },
 {
  "id": "corse",
  "name": "Corse",
  "code": "COR",
  "color": "#14806F",
  "ink": "#FFFFFF",
  "why": "Vert maquis / émeraude",
  "contrast": 4.8
 },
 {
  "id": "sud-ouest",
  "name": "Sud-Ouest",
  "code": "SDO",
  "color": "#C2407A",
  "ink": "#FFFFFF",
  "why": "Rose framboise (piment, Armagnac)",
  "contrast": 4.9
 }
];document.getElementById('g').innerHTML=P.map(p=>`<div class="sw" style="background:${p.color};color:${p.ink}"><div><span class="c">${p.code}</span> <b>${p.name}</b></div><small>${p.why}</small><span class="hex">${p.color} · contraste ${p.contrast}</span></div>`).join('')</script></body></html>
